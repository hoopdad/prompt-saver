name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore .\PromptSaver.sln --locked-mode
      - name: Verify formatting
        run: dotnet format .\PromptSaver.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build .\PromptSaver.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Run fast tests
        run: |
          dotnet test --project .\tests\PromptSaver.Domain.Tests\PromptSaver.Domain.Tests.csproj -c Release --no-build
          dotnet test --project .\tests\PromptSaver.Application.Tests\PromptSaver.Application.Tests.csproj -c Release --no-build
          dotnet test --project .\tests\PromptSaver.Infrastructure.Tests\PromptSaver.Infrastructure.Tests.csproj -c Release --no-build
          dotnet test --project .\tests\PromptSaver.Desktop.Tests\PromptSaver.Desktop.Tests.csproj -c Release --no-build

  windows-packages:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build unsigned Windows packages
        shell: pwsh
        run: .\scripts\Build-WindowsPackages.ps1 -RuntimeIdentifier all -Version 0.1.0
      - name: Upload unsigned package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PromptSaver-0.1.0-unsigned-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/installers/**/*.msi
            artifacts/manifests/*
